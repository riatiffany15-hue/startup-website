<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Startup</title>
  <!-- One unique link to style.css, which imports all the components -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Banner -->
  <div class="banner">
    <div class="container">
      <h1 class="page-title">Change your life, learn to code</h1>
      <h2>Le Wagon brings tech skills to creative people.</h2>
      <a href="#" class="btn-blue">Apply now</a>
      <button class="shout-button btn-blue">Say hello</button>
    </div>
  </div>

  <!-- Grid of cards -->
  <div class="container">
    <div class="cards">
      <div class="card">
        <img src="images/shanghai.jpg" alt="Le Wagon Shanghai">
        <h3>Shanghai</h3>
      </div>
      <div class="card">
        <img src="images/paris.jpg" alt="Le Wagon Paris">
        <h3>Paris</h3>
      </div>
      <div class="card">
        <img src="images/rio.jpg" alt="Le Wagon Rio">
        <h3>Rio</h3>
      </div>
    </div>
  </div>

  <!-- Typeform: contact form embedded in the page -->
  <div class="container">
    <h3>Get in touch</h3>
   <div data-tf-widget="UYaR18Ia" style="width:100%;height:500px;"></div>
    <script src="https://embed.typeform.com/next/embed.js"></script>


  <!-- UI kit: the simple components on their own -->
  <div class="container">
    <h3>Avatars</h3>
    <img src="images/avatar.jpg" alt="Profile picture" class="avatar">
    <img src="images/avatar.jpg" alt="Profile picture" class="avatar-large">

    <h3>Button</h3>
    <a href="#" class="btn-blue">Primary button</a>

    <h3>Contact</h3>
    <p>Contact me: <span class="email">jane@example.com</span></p>
    <button class="copy-email btn-blue">Copy my email</button>
  </div>

  <script src="behavior.js"></script>

</body>
</html>
